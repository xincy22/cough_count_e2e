# TCN/BiGRU ablation v2, parameter-budgeted around 0.7M.
# Purpose: analyze temporal convolution, unidirectional GRU, and bidirectional GRU
# under the same data/training protocol.

name: "loso_ablation_tcn_bigru_v2_0p7m"
description: "TCN/BiGRU ablation with main models near the 0.7M parameter budget"
hypothesis: "TCN should provide the main local temporal feature extraction gain; BiGRU may improve positive-sample sensitivity at the cost of more negative residual response."

seed: 42

data:
  base_npy_dir: "../../../data/processed/edgeai/npy"
  splits_json: "../../../data/processed/edgeai/splits.json"
  split_train: "train"
  split_val: "val"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

density:
  kernel: "skewed_gaussian"
  sigma_sec: 0.05
  sigma_left_sec: 0.03
  sigma_right_sec: 0.10
  data_dir: "skewed_l30ms_r100ms"
  description: "Best kernel from previous density-kernel experiments"

models:
  - id: "A0"
    name: "bigru_only_0p7m"
    description: "Bidirectional GRU-only baseline, parameter-matched around 0.7M"
    architecture:
      type: "gru"
      proj_channels: 288
      gru_hidden: 192
      gru_layers: 1
      bidirectional: true
      dropout: 0.1

  - id: "A1"
    name: "tcn_0p7m"
    description: "TCN-only capacity control, parameter-matched around 0.7M"
    architecture:
      type: "tcn"
      channels: 160
      layers: 4
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1

  - id: "A2"
    name: "tcn_unigru_0p7m"
    description: "TCN + unidirectional GRU, parameter-matched around 0.7M"
    architecture:
      type: "tcn_gru"
      tcn_channels: 128
      tcn_layers: 4
      tcn_kernel_size: 3
      dilation_base: 2
      gru_hidden: 224
      gru_layers: 1
      bidirectional: false
      dropout: 0.1

  - id: "A3"
    name: "tcn_bigru_0p7m"
    description: "TCN + bidirectional GRU, parameter-matched around 0.7M"
    architecture:
      type: "tcn_gru"
      tcn_channels: 128
      tcn_layers: 4
      tcn_kernel_size: 3
      dilation_base: 2
      gru_hidden: 144
      gru_layers: 1
      bidirectional: true
      dropout: 0.1

  - id: "A4"
    name: "tcn_front_matched_aux"
    description: "Auxiliary front-end matched TCN-only control; not enabled by default because it has fewer parameters"
    architecture:
      type: "tcn"
      channels: 128
      layers: 4
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1

loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.5
  val_equal_pos_neg: true
  val_balance_seed: 42
  pin_memory: true
  persistent_workers: true

training:
  epochs: 500
  lr: 1.0e-3
  weight_decay: 0.0
  device: "cuda"
  best_metric: "val_count_mae"
  val_metric_pos_weight: 1.0
  val_metric_neg_weight: 1.0
  lr_cycle_epochs: 100
  lr_eta_min: 1.0e-8
  count_loss_weight: 0.5
  count_loss_mode: "mae"
  count_rel_eps: 1.0
  under_count_weight: 0.0
  under_count_positive_only: true
  equal_pos_neg_influence: false
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.9
    alpha: 0.8
    min_pos_ratio: 0.1
    max_pos_ratio: 0.9
    warmup_epochs: 2

loso:
  enabled: true
  models: ["A0", "A1", "A2", "A3"]
  num_folds: 15
  exp_name: "loso_ablation_tcn_bigru_v2_0p7m"
  epochs: 500
  device: "cuda"
  batch_size: 24
  num_workers: 8

output:
  runs_dir: "runs"
  results_dir: "result"

metrics:
  primary: "test_count_mae"
  secondary: ["test_count_mae_pos", "test_count_mae_neg"]
