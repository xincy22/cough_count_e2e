# Chapter 5 rerun job queue.
# Intended deployment: 1 machine x 4 RTX4090 = 4 shard workers.

name: "ch5_rerun_0p7m"
description: "Self-contained rerun queue for Chapter 5 structure comparison and ablation."
default_num_shards: 4
default_batch_size: 24
default_num_workers: 4

jobs:
