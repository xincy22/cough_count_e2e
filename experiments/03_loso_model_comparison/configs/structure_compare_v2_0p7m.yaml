# LOSO 10-model comparison, parameter-budgeted around 0.7M.
# Purpose: model comparison under one unified cough-counting protocol.

name: "loso_10model_compare_0p7m"
description: "10 model-family comparison with all models near the 0.7M parameter budget"
hypothesis: "Under the same LOSO/data/training protocol and similar parameter budget, explicit temporal modeling should outperform purely convolutional counting baselines."

seed: 42

data:
  base_npy_dir: "../../../data/processed/edgeai/npy"
  splits_json: "../../../data/processed/edgeai/splits.json"
  split_train: "train"
  split_val: "val"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

density:
  kernel: "skewed_gaussian"
  sigma_sec: 0.05
  sigma_left_sec: 0.03
  sigma_right_sec: 0.10
  data_dir: "skewed_l30ms_r100ms"
  description: "Best kernel from previous density-kernel experiments"

models:
  - id: "S0"
    name: "cnn1d_0p7m"
    description: "Plain multi-layer 1D CNN baseline, 0.7M budget"
    architecture:
      type: "cnn1d"
      channels: [48, 96, 160, 224, 288]
      kernel_size: 5
      dropout: 0.1

  - id: "S1"
    name: "dscnn_0p7m"
    description: "Depthwise-separable residual CNN baseline, 0.7M budget"
    architecture:
      type: "dscnn"
      channels: [128, 160, 224, 224, 320]
      kernel_size: 3
      dropout: 0.1

  - id: "S2"
    name: "rescnn_0p7m"
    description: "Residual CNN baseline, 0.7M budget"
    architecture:
      type: "rescnn"
      channels: [64, 192, 256]
      kernel_size: 3
      dropout: 0.1

  - id: "S3"
    name: "crnn_0p7m"
    description: "CNN + unidirectional GRU baseline, 0.7M budget"
    architecture:
      type: "crnn"
      cnn_channels: [96, 128, 128, 144, 176]
      kernel_size: 3
      rnn_hidden: 256
      rnn_layers: 1
      dropout: 0.1

  - id: "S4"
    name: "bicrnn_0p7m"
    description: "CNN + bidirectional GRU baseline, 0.7M budget"
    architecture:
      type: "bicrnn"
      cnn_channels: [64, 144, 176, 224, 224]
      kernel_size: 3
      rnn_hidden: 112
      rnn_layers: 1
      bidirectional: true
      dropout: 0.1

  - id: "S5"
    name: "bigru_0p7m"
    description: "Bidirectional GRU baseline with pointwise input projection, 0.7M budget"
    architecture:
      type: "gru"
      proj_channels: 288
      gru_hidden: 192
      gru_layers: 1
      bidirectional: true
      dropout: 0.1

  - id: "S6"
    name: "tcn_0p7m"
    description: "Residual dilated TCN baseline, 0.7M budget"
    architecture:
      type: "tcn"
      channels: 160
      layers: 4
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1

  - id: "S7"
    name: "tcn_attn_0p7m"
    description: "TCN + one self-attention block, 0.7M budget"
    architecture:
      type: "tcn_attn"
      channels: 128
      tcn_layers: 5
      kernel_size: 3
      dilation_base: 2
      attn_heads: 1
      attn_layers: 1
      ff_mult: 2
      dropout: 0.1

  - id: "S8"
    name: "tcn_unigru_0p7m"
    description: "TCN + unidirectional GRU, 0.7M budget"
    architecture:
      type: "tcn_gru"
      tcn_channels: 128
      tcn_layers: 4
      tcn_kernel_size: 3
      dilation_base: 2
      gru_hidden: 224
      gru_layers: 1
      bidirectional: false
      dropout: 0.1

  - id: "S9"
    name: "tcn_bigru_0p7m"
    description: "TCN + bidirectional GRU, 0.7M budget"
    architecture:
      type: "tcn_gru"
      tcn_channels: 128
      tcn_layers: 4
      tcn_kernel_size: 3
      dilation_base: 2
      gru_hidden: 144
      gru_layers: 1
      bidirectional: true
      dropout: 0.1

loader:
  batch_size: 24
  num_workers: 4
  pos_fraction: 0.5
  val_equal_pos_neg: true
  val_balance_seed: 42
  pin_memory: true
  persistent_workers: true

training:
  epochs: 500
  lr: 1.0e-3
  weight_decay: 0.0
  device: "cuda"
  best_metric: "val_count_mae"
  val_metric_pos_weight: 1.0
  val_metric_neg_weight: 1.0
  lr_cycle_epochs: 100
  lr_eta_min: 1.0e-8
  count_loss_weight: 0.5
  count_loss_mode: "mae"
  count_rel_eps: 1.0
  under_count_weight: 0.0
  under_count_positive_only: true
  equal_pos_neg_influence: false
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.9
    alpha: 0.8
    min_pos_ratio: 0.1
    max_pos_ratio: 0.9
    warmup_epochs: 2

loso:
  enabled: true
  models: ["S0", "S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8", "S9"]
  num_folds: 15
  exp_name: "loso_10model_compare_0p7m"
  epochs: 500
  device: "cuda"
  batch_size: 24
  num_workers: 4

output:
  runs_dir: "runs"
  results_dir: "result"

metrics:
  primary: "test_count_mae"
  secondary: ["test_count_mae_pos", "test_count_mae_neg"]
