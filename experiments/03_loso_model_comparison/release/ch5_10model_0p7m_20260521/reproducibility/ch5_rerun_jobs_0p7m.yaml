# Chapter 5 10-model LOSO comparison queue.
# Intended deployment: 1 machine x 4 RTX4090 = 4 shard workers.

name: "ch5_10model_compare_0p7m"
description: "Self-contained rerun queue for the Chapter 5 10-model comparison."
default_num_shards: 4
default_batch_size: 24
default_num_workers: 4

jobs:
  - job_id: "J00"
    shard: 0
    group: "comparison"
    config: "configs/structure_compare_v2_0p7m.yaml"
    model_id: "S0"
    model_name: "cnn1d_0p7m"
    expected_params: 726641

