# Best Combination Validation Experiment
# Validate the best combination of density kernel and loss function

name: "best_combination"
description: "验证最佳density核函数和最佳损失函数的组合效果"

# Random seed
seed: 42

# Data configuration
data:
  base_npy_dir: "../../../data/processed/edgeai/npy"
  splits_json: "../../../data/processed/edgeai/splits.json"
  split_train: "train"
  split_val: "val"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

# Combinations to test (update after 02_density_kernel and 03_loss_function complete)
combinations:
  - id: "3A"
    name: "baseline_original"
    kernel: "gaussian"
    sigma_sec: 0.05
    sigma_left_sec: 0.04
    sigma_right_sec: 0.08
    count_loss_weight: 0.2
    under_count_weight: 0.0
    under_count_positive_only: true
    data_dir: "gaussian_sigma50ms"
    description: "原始基线配置"

  # TODO: Add 3B and 3C after determining best configs from previous experiments
  # - id: "3B"
  #   name: "best_combination"
  #   description: "阶段1最佳density + 阶段2最佳loss"
  # - id: "3C"
  #   name: "conservative_combination"
  #   description: "阶段1最佳density + 保守loss策略"

# Data loader configuration
loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.7
  val_equal_pos_neg: true
  val_balance_seed: 42
  pin_memory: true
  persistent_workers: true

# Training configuration
training:
  epochs: 500
  lr: 1.0e-3
  weight_decay: 0.0
  device: "cuda"
  best_metric: "val_count_mae"
  val_metric_pos_weight: 1.0
  val_metric_neg_weight: 1.0
  lr_cycle_epochs: 100
  lr_eta_min: 1.0e-8

  count_loss_mode: "mae"
  count_rel_eps: 1.0
  equal_pos_neg_influence: false

  # Dynamic pos/neg loss balancer
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.9
    alpha: 0.8
    min_pos_ratio: 0.1
    max_pos_ratio: 0.9
    warmup_epochs: 2

# Model configuration
model:
  name: "tcn"
  presets:
    tcn:
      channels: 128
      layers: 6
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1

# LOSO configuration
loso:
  enabled: false  # Set to true for LOSO evaluation
  models: ["tcn"]
  exp_name: ""
  epochs: null
  device: null
  batch_size: null
  num_workers: null

# Output paths
output:
  runs_dir: "runs"

# Evaluation metrics
metrics:
  primary: "val_count_mae_pos"
  secondary: ["val_mean_pred_count_on_neg", "val_count_mae"]
