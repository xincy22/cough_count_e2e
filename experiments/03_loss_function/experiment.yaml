# Loss Function Comparison Experiment
# Compare different loss function configurations for cough counting

name: "loss_function_comparison"
description: "对比不同损失函数配置下的模型性能"

hypothesis: "提高count loss权重和添加假阳性惩罚能改善模型性能"

# Random seed
seed: 42

# Data configuration (use best density kernel from 02_density_kernel)
data:
  npy_dir: "../../../data/processed/edgeai/npy"
  splits_json: "../../../data/processed/edgeai/splits.json"
  split_train: "train"
  split_val: "val"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

# Density configuration (default, update after 02_density_kernel completes)
density:
  kernel: "gaussian"
  sigma_sec: 0.05

# Loss function variants to compare
loss_configs:
  - id: "2A"
    name: "count_w_0.2"
    count_loss_weight: 0.2
    under_count_weight: 0.0
    under_count_positive_only: true
    description: "对照组 - 当前默认配置"

  - id: "2B"
    name: "count_w_0.5"
    count_loss_weight: 0.5
    under_count_weight: 0.0
    under_count_positive_only: true
    description: "中等count权重"

  - id: "2C"
    name: "count_w_1.0"
    count_loss_weight: 1.0
    under_count_weight: 0.0
    under_count_positive_only: true
    description: "高count权重"

  - id: "2D"
    name: "count_w_2.0"
    count_loss_weight: 2.0
    under_count_weight: 0.0
    under_count_positive_only: true
    description: "更高count权重"

  - id: "2E"
    name: "count_w_1.0_under_0.1"
    count_loss_weight: 1.0
    under_count_weight: 0.1
    under_count_positive_only: true
    description: "高count权重 + 轻微假阳性惩罚"

  - id: "2F"
    name: "count_w_1.0_under_0.5"
    count_loss_weight: 1.0
    under_count_weight: 0.5
    under_count_positive_only: true
    description: "高count权重 + 强假阳性惩罚"

# Data loader configuration
loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.7
  val_equal_pos_neg: true
  val_balance_seed: 42
  pin_memory: true
  persistent_workers: true

# Training configuration (shared across all loss variants)
training:
  epochs: 500
  lr: 1.0e-3
  weight_decay: 0.0
  device: "cuda"
  best_metric: "val_count_mae"
  val_metric_pos_weight: 1.0
  val_metric_neg_weight: 1.0
  lr_cycle_epochs: 100
  lr_eta_min: 1.0e-8

  # Base loss configuration (will be overridden by loss_configs)
  count_loss_mode: "mae"
  count_rel_eps: 1.0
  equal_pos_neg_influence: false

  # Dynamic pos/neg loss balancer
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.9
    alpha: 0.8
    min_pos_ratio: 0.1
    max_pos_ratio: 0.9
    warmup_epochs: 2

# Model configuration
model:
  name: "tcn"
  presets:
    tcn:
      channels: 128
      layers: 6
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1

# LOSO configuration
loso:
  enabled: false  # Set to true for LOSO evaluation
  models: ["tcn"]
  exp_name: ""
  epochs: null
  device: null
  batch_size: null
  num_workers: null

# Output paths
output:
  runs_dir: "runs"

# Evaluation metrics
metrics:
  primary: "val_count_mae_pos"
  secondary: ["val_mean_pred_count_on_neg", "val_count_mae"]
