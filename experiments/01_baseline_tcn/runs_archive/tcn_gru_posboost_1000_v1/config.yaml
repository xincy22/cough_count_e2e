seed: 42
data:
  split_train: train
  split_val: val
  splits_json: data/processed/edgeai/splits.json
  mic: both
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01
loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.7
train:
  epochs: 1000
  lr: 0.001
  weight_decay: 0.0
  device: cuda
  lr_cycle_epochs: 100
  lr_eta_min: 1.0e-08
  count_loss_weight: 0.2
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.9
    alpha: 0.8
    min_pos_weight: 1.5
    max_pos_weight: 12.0
    warmup_epochs: 2
model:
  name: tcn_gru
  presets:
    tcn_gru:
      tcn_channels: 192
      tcn_layers: 6
      tcn_kernel_size: 3
      dilation_base: 2
      gru_hidden: 192
      gru_layers: 1
      bidirectional: false
      dropout: 0.1
