# Baseline Experiment
# 使用最佳density核配置建立性能基线
# 用于所有后续实验的对比参考

name: "baseline"
description: "Baseline model using best density kernel (skewed_20_120)"

# Random seed
seed: 42

# Data configuration
data:
  base_npy_dir: "../../../data/processed/edgeai/npy"
  splits_json: "../../../data/processed/edgeai/splits.json"
  split_train: "train"
  split_val: "val"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

# Best density kernel configuration (from 02_density_kernel)
density:
  kernel: "skewed_gaussian"
  sigma_sec: 0.05
  sigma_left_sec: 0.02
  sigma_right_sec: 0.12
  data_dir: "skewed_l20ms_r120ms"
  description: "Best kernel: left-narrow right-wide skewed gaussian (20ms/120ms)"

# Model configuration (TCN, same as 02_density_kernel)
model:
  name: "tcn"
  presets:
    tcn:
      channels: 256
      layers: 8
      kernel_size: 3
      dilation_base: 2
      dropout: 0.1

# Data loader configuration
loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.5
  val_equal_pos_neg: true
  val_balance_seed: 42
  pin_memory: true
  persistent_workers: true

# Training configuration
training:
  epochs: 1000
  lr: 1.0e-3
  weight_decay: 0.0
  device: "cuda"
  best_metric: "val_count_mae"
  val_metric_pos_weight: 1.0
  val_metric_neg_weight: 1.0
  lr_cycle_epochs: 100
  lr_eta_min: 1.0e-8

  # Loss weights
  count_loss_weight: 0.5
  count_loss_mode: "mae"
  count_rel_eps: 1.0
  under_count_weight: 0.0
  under_count_positive_only: true
  equal_pos_neg_influence: false

  # Dynamic pos/neg loss balancer
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.9
    alpha: 0.8
    min_pos_ratio: 0.1
    max_pos_ratio: 0.9
    warmup_epochs: 2

# Output paths
output:
  runs_dir: "runs"
  results_dir: "result"

# Evaluation targets
targets:
  test_count_mae: 0.20
  test_count_mae_pos: 0.60
  test_count_mae_neg: 0.08
