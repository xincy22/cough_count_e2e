seed: 42

data:
  split_train: "train"
  split_val: "val"
  splits_json: "data/processed/edgeai/splits.json"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.7
  val_equal_pos_neg: true
  val_balance_seed: 42

train:
  epochs: 1000
  lr: 1.0e-3
  weight_decay: 0.0
  device: "cuda"
  best_metric: "val_weighted_count_mae" # val_count_mae | val_count_mae_pos | val_count_mae_neg | val_weighted_count_mae
  val_metric_pos_weight: 1.0
  val_metric_neg_weight: 1.0
  lr_cycle_epochs: 100
  lr_eta_min: 1.0e-8
  count_loss_weight: 0.2
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.9
    alpha: 0.8
    min_pos_ratio: 0.1
    max_pos_ratio: 0.9
    warmup_epochs: 2

model:
  name: "tcn_gru"
  presets:
    tcn_gru:
      tcn_channels: 192
      tcn_layers: 6
      tcn_kernel_size: 3
      dilation_base: 2
      gru_hidden: 192
      gru_layers: 1
      bidirectional: false
      dropout: 0.1
