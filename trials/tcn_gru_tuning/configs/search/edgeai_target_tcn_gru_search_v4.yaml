seed: 42

data:
  split_train: "train"
  split_val: "val"
  splits_json: "data/processed/edgeai/splits.json"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.7

train:
  epochs: 300
  lr: 3.0e-4
  weight_decay: 2.0e-4
  device: "cuda"
  lr_cycle_epochs: 300
  lr_eta_min: 1.0e-8
  count_loss_weight: 0.6
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.97
    alpha: 0.8
    min_pos_ratio: 0.666667
    max_pos_ratio: 0.909091
    warmup_epochs: 3

model:
  name: "tcn_gru"
  presets:
    tcn_gru:
      tcn_channels: 192
      tcn_layers: 6
      tcn_kernel_size: 3
      dilation_base: 2
      gru_hidden: 192
      gru_layers: 1
      bidirectional: false
      dropout: 0.1
