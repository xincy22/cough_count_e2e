seed: 42

data:
  split_train: "train"
  split_val: "val"
  splits_json: "data/processed/edgeai/splits.json"
  mic: "both"
  window_sec: 8.0
  hop_sec: 4.0
  pos_threshold: 0.01

loader:
  batch_size: 24
  num_workers: 8
  pos_fraction: 0.6

train:
  epochs: 500
  lr: 3.0e-4
  weight_decay: 1.0e-4
  device: "cuda"
  lr_cycle_epochs: 500
  lr_eta_min: 1.0e-8
  count_loss_weight: 0.25
  dynamic_pos_neg_loss:
    enabled: true
    ema_beta: 0.95
    alpha: 1.0
    min_pos_ratio: 0.75
    max_pos_ratio: 0.888889
    warmup_epochs: 1

model:
  name: "tcn"
  presets:
    tcn:
      channels: 192
      layers: 7
      kernel_size: 3
      dropout: 0.1
      dilation_base: 2
